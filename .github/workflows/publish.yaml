# This workflow will release the packages with Changesets

name: Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: write-all

# make sure there are no other workflows running concurrently
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{github.job}}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint -- --affected

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{github.job}}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{github.job}}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test -- --affected

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{github.job}}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build -- --affected

  publish:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      pull-requests: write
      contents: write
      id-token: write # Required for OIDC
      packages: write # Required for GitHub Packages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-release-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run prepareRelease -- --affected

      # Release mode: push to main
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: Bump version packages
          publish: npm run release
          version: npm run changeset:version
          commit: Bump version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push git tag after publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changesets.outputs.published == 'true'
        run: git push --follow-tags

      - name: Setup Node.js with Github packages registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changesets.outputs.published == 'true'
        uses: actions/setup-node@v4
        with:
          registry-url: 'https://npm.pkg.github.com'
          node-version: 24

      - name: Publish to Github packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changesets.outputs.published == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run release -- --no-git-tags
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Nightly mode: pull request to main
      # Skipped on the Changesets release PR: its changesets are already consumed, so
      # `changeset version --snapshot` is a no-op there and the following publish would
      # push the real release version under the nightly tag, making the release run on
      # main a no-op (no git tags, no GitHub release, no `latest` tag on npm).
      - name: Generate changelog
        id: nightly-version
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: |
          npm run changeset version -- --snapshot nightly
          if git diff --name-only -- ':(glob)**/package.json' | grep -q .; then
            echo 'hasSnapshot=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No changesets in this PR, skipping nightly publish' >> "$GITHUB_STEP_SUMMARY"
            echo 'hasSnapshot=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish nightly
        id: publish-nightly
        if: github.event_name == 'pull_request' && steps.nightly-version.outputs.hasSnapshot == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run changeset publish -- --snapshot --tag nightly
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR with nightly build info
        if: github.event_name == 'pull_request' && steps.nightly-version.outputs.hasSnapshot == 'true'
        run: npx tsx ./scripts/nightlyGithubAction.ts --packages '${{ steps.publish-nightly.outputs.publishedPackages }}' --pull-request ${{ github.event.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy_docs:
    name: Deploy docs
    needs: [publish]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.outputs.published == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build -- --filter=docs --force

      - name: Fix permissions
        run: |
          chmod -c -R +rX "_site/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload docs build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

      - name: Deploy docs to GitHub pages
        uses: actions/deploy-pages@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
